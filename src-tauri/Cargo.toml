[package]
name = "cq-paster"
version = "0.5.1"
description = "CQ Paster - an ultra-minimal multi-slot clipboard manager"
authors = ["Garrett"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "cq_paster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Window transparency needs both the config flag and this Cargo feature. Adding
# it here rather than to the shared `tauri` dependency keeps the Windows build's
# feature set exactly as it was.
tauri = { version = "2", features = ["macos-private-api"] }
# Tauri already pulls these in on macOS; pinning the same majors keeps one copy.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSPasteboard",
  "NSPasteboardItem",
  "NSWindow",
  "NSResponder",
  "NSButton",
  "NSControl",
  "NSView",
  "NSColor",
  "NSAlert",
  "NSApplication",
  "NSWorkspace",
  "NSRunningApplication",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSString",
  "NSData",
  "NSURL",
] }

[target.'cfg(windows)'.dependencies]
rdev = { version = "0.5", features = ["unstable_grab"] }
clipboard-win = "5"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
] }
